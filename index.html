<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KING KHANFlix</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:white;
}

header{
background:#000;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

.logo{
color:red;
font-size:28px;
font-weight:bold;
}

#search{
padding:8px;
border:none;
border-radius:5px;
width:150px;
}

.banner{
padding:70px 20px;
text-align:center;
background:linear-gradient(to right,#000,#222);
}

.banner h1{
font-size:38px;
margin:0;
}

.banner p{
color:#ccc;
}

.btn{
display:inline-block;
margin:5px;
padding:10px 18px;
background:red;
color:white;
text-decoration:none;
border-radius:5px;
}

.categories{
padding:10px;
text-align:center;
}

.categories button{
margin:5px;
padding:8px 14px;
border:none;
border-radius:5px;
background:#333;
color:white;
}

.movies{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:20px;
}

.card{
background:#222;
padding:10px;
border-radius:10px;
text-align:center;
}

.card img{
width:100%;
height:240px;
object-fit:cover;
border-radius:10px;
}

.card h3{
font-size:15px;
}

.smallbtn{
display:block;
margin:5px 0;
padding:8px;
background:red;
color:white;
text-decoration:none;
border-radius:5px;
font-size:14px;
}

footer{
text-align:center;
padding:20px;
color:gray;
}
</style>
</head>

<body>

<header>
<div class="logo">KING KHANFlix</div>
<input type="text" id="search" placeholder="Search Movies..." onkeyup="searchMovies()">
</header>

<section class="banner">
<h1>Unlimited Movies</h1>
<p>Watch Anytime, Anywhere</p>
<a href="#" class="btn">Watch Now</a>
<a href="#" class="btn">Join Now</a>
</section>

<section class="categories">
<button>Action</button>
<button>Comedy</button>
<button>Horror</button>
<button>Drama</button>
<button>Romance</button>
</section>

<section class="movies" id="movieList">

<div class="card"><img src="https://via.placeholder.com/300x450?text=Avengers"><h3>Avengers</h3><a href="#" class="smallbtn">▶ Watch</a><a href="#" class="smallbtn">⬇ Download</a></div>

<div class="card"><img src="https://via.placeholder.com/300x450?text=Jawan"><h3>Jawan</h3><a href="#" class="smallbtn">▶ Watch</a><a href="#" class="smallbtn">⬇ Download</a></div>

<div class="card"><img src="https://via.placeholder.com/300x450?text=Pathaan"><h3>Pathaan</h3><a href="#" class="smallbtn">▶ Watch</a><a href="#" class="smallbtn">⬇ Download</a></div>

<div class="card"><img src="https://via.placeholder.com/300x450?text=Fast+X"><h3>Fast X</h3><a href="#" class="smallbtn">▶ Watch</a><a href="#" class="smallbtn">⬇ Download</a></div>

<div class="card"><img src=""https://upload.wikimedia.org/wikipedia/en/6/61/Animal_film_poster.jpg"><h3>Animal</h3><a href="#" class="smallbtn">▶ Watch</a><a href="#" class="smallbtn">⬇ Download</a></div>

<div class="card"><img src="https://via.placeholder.com/300x450?text=KGF+2"><h3>KGF 2</h3><a href="#" class="smallbtn">▶ Watch</a><a href="#" class="smallbtn">⬇ Download</a></div>

</section>

<footer>
© 2026 KING KHANFlix
</footer>

<script>
function searchMovies(){
let input=document.getElementById("search").value.toLowerCase();
let cards=document.getElementsByClassName("card");

for(let i=0;i<cards.length;i++){
let title=cards[i].innerText.toLowerCase();
cards[i].style.display=title.includes(input) ? "block":"none";
}
}
</script>

</body>
                                  </html>
