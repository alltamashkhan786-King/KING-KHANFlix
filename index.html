<!DOCTYPE html>

header{
background:#000;

text-align:center;
font-size:28px;
font-weight:bold;
color:red;
}

.movies{
display:grid;
grid-template-columns:repeat(2,1fr);

}

.card{
background:#222;
border-radius:12px;
overflow:hidden;

}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.info{
padding:10px;
}

.info h3{
margin:0;
font-size:16px;
}

.tag{
display:inline-block;
background:red;
padding:3px 8px;
border-radius:20px;
font-size:12px;
margin-top:6px;
}

.icons{
display:flex;
justify-content:space-between;
margin-top:10px;
font-size:20px;
}

.icons a{
color:white;
text-decoration:none;
background:#333;
padding:8px 12px;
border-radius:8px;
}

footer{
text-align:center;
padding:15px;
color:gray;
}
</style>
</head>
