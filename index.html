<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KING KHANFlix</title>

<style>
body{
margin:0;
font-family:Arial;
background:#111;
color:white;
}

header{
background:#000;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:red;
font-size:28px;
font-weight:bold;
}

.search{
padding:8px;
border:none;
border-radius:5px;
width:140px;
}

.banner{
background:url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c') center/cover;
padding:70px 20px;
text-align:center;
}

.banner h1{
font-size:38px;
margin:0;
}

.banner p{
font-size:18px;
}

.btn{
display:inline-block;
margin:5px;
padding:10px 18px;
background:red;
color:white;
text-decoration:none;
border-radius:5px;
}

.movies{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:20px;
}

.card{
background:#222;
padding:10px;
border-radius:10px;
text-align:center;
}

.card img{
width:100%;
height:250px;
object-fit:cover;
border-radius:10px;
}

.card h3{
font-size:16px;
}

.smallbtn{
display:block;
margin:5px 0;
padding:8px;
background:red;
color:white;
text-decoration:none;
border-radius:5px;
font-size:14px;
}

footer{
text-align:center;
padding:20px;
color:gray;
}
</style>
</head>

<body>

<header>
<div class="logo">KING KHANFlix</div>
<input class="search" placeholder="Search">
</header>

<section class="banner">
<h1>Unlimited Entertainment</h1>
<p>Watch Movies Anytime Anywhere</p>
<a href="#" class="btn">Watch Now</a>
<a href="#" class="btn">Download App</a>
</section>

<section class="movies">

<div class="card">
<img src="https://via.placeholder.com/300x450?text=Avengers">
<h3>Avengers</h3>
<a href="#" class="smallbtn">▶ Watch</a>
<a href="#" class="smallbtn">⬇ Download</a>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x450?text=Fast+X">
<h3>Fast X</h3>
<a href="#" class="smallbtn">▶ Watch</a>
<a href="#" class="smallbtn">⬇ Download</a>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x450?text=Jawan">
<h3>Jawan</h3>
<a href="#" class="smallbtn">▶ Watch</a>
<a href="#" class="smallbtn">⬇ Download</a>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x450?text=Pathaan">
<h3>Pathaan</h3>
<a href="#" class="smallbtn">▶ Watch</a>
<a href="#" class="smallbtn">⬇ Download</a>
</div>

</section>

<footer>
© KING KHANFlix 2026
</footer>

</body>
  </html>
